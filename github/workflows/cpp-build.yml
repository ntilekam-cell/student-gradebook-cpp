name: C++ Build Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "maini" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile gradebook with g++
        run: g++ -std=c++17 main.cpp gradebook.cpp -o gradebook

      - name: Verify executable created
        run: test -f ./gradebook
